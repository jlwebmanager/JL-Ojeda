<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Colección de obra pictórica.">
  <title>Obras | Obra</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecera">
    <nav aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a class="activo" href="obras.html">Obras</a>
      <a href="artista.html">Artista</a>
    </nav>
  </header>
  <main>
    <section class="seccion obras pagina-interior">
      <div class="titulo-seccion">
        <p class="eyebrow">COLECCIÓN</p>
        <h1 id="titulo-coleccion">Obras seleccionadas</h1>
      </div>
      <div id="galeria" class="galeria" aria-live="polite"></div>
      <p id="sin-obras" class="sin-obras" hidden>Aún no hay obras en esta colección.</p>
    </section>
  </main>
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Vista ampliada de la obra">
    <button class="cerrar" type="button" aria-label="Cerrar">×</button>
    <img id="imagen-modal" alt="">
    <div class="pie-modal"><strong id="titulo-modal"></strong><span id="detalle-modal"></span></div>
  </div>
  <footer>© <span id="anio"></span> <span id="pie-nombre">Obra</span></footer>
  <script src="app.js"></script>
</body>
</html>
